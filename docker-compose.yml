services:
  postgres:
    image: postgres:16-alpine
    container_name: hypixel-bridge-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=bridge
      - POSTGRES_USER=bridge
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bridge -d bridge']
      interval: 5s
      timeout: 5s
      retries: 5

  bridge:
    build: .
    container_name: hypixel-bridge
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./logs:/app/logs
      - ./plugins:/app/plugins
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://bridge:${DB_PASSWORD:-changeme}@postgres:5432/bridge

volumes:
  postgres_data:
