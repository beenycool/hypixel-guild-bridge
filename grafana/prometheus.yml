# Prometheus scrape config for hypixel-guild-discord-bridge
# Use this with Prometheus or Grafana Agent to collect metrics from the bridge app.
#
# The bridge exposes /metrics on the same port as /uptime and /health.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # For Heroku: use your app URL (no port needed). Example:
  #   targets: ['safe-citadel-79898-0cfea9458f9b.herokuapp.com']
  - job_name: 'hypixel-guild-bridge-heroku'
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets: ['safe-citadel-79898-0cfea9458f9b.herokuapp.com']

  # For local dev: uncomment and replace port if different
  # - job_name: 'hypixel-guild-bridge-local'
  #   metrics_path: /metrics
  #   scheme: http
  #   static_configs:
  #     - targets: ['localhost:47478']
