# Grafana dashboard provisioning
# Mount this folder to /etc/grafana/provisioning/dashboards when running Grafana
apiVersion: 1
providers:
  - name: 'hypixel-bridge'
    orgId: 1
    folder: 'Hypixel Bridge'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/hypixel-bridge
