<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings — Rankup</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="app-nav"></div>
    <div class="app-container wide">
      <div class="page-header">
        <div>
          <h1 class="page-title">Settings</h1>
          <div class="text-xs text-muted">Configure bridge behavior</div>
        </div>
        <div class="bridge-selector">
          <label class="form-label">Bridge:</label>
          <select class="select" id="bridge-select"></select>
          <button class="btn btn-secondary btn-sm" id="create-bridge-btn">+ New Bridge</button>
          <span class="ws-status connecting" id="ws-status" title="WebSocket connection">
            <span class="ws-status-dot"></span>
            <span class="ws-status-text">connecting…</span>
          </span>
        </div>
      </div>

      <div class="settings-layout">
        <aside class="settings-sidebar" id="settings-sidebar">
          <div class="settings-sidebar-head">
            <span class="settings-sidebar-title">Categories</span>
            <button class="settings-sidebar-close" id="settings-sidebar-close" aria-label="Close settings navigation">
              &times;
            </button>
          </div>
          <ul class="settings-nav-list" id="settings-nav"></ul>
        </aside>
        <div class="settings-sidebar-overlay" id="settings-sidebar-overlay"></div>
        <button class="settings-sidebar-toggle" id="settings-sidebar-toggle" aria-label="Open settings navigation">
          ☰
        </button>
        <section class="settings-panel" id="settings-panel">
          <div class="loading"><div class="loading-spinner"></div></div>
        </section>
      </div>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ws.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/common.js"></script>
    <script src="js/settings.js"></script>
  </body>
</html>
