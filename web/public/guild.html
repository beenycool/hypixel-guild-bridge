<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guild — Rankup</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/nav.css" />
    <link rel="stylesheet" href="css/utilities.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <div id="app-nav"></div>
    <div class="app-container">
      <div class="page-header">
        <h1 class="page-title">Guild Overview</h1>
      </div>
      <div id="guild-summary"></div>
      <div class="card mb-md">
        <div class="card-header">
          <h2>Members</h2>
          <input
            type="text"
            class="input"
            style="max-width: 220px"
            id="member-filter"
            placeholder="Filter by name..."
            autocomplete="off"
          />
        </div>
        <div class="card-body" id="members-content">
          <div class="loading"><div class="loading-spinner"></div></div>
        </div>
      </div>
    </div>
    <script type="module">
      import { Auth } from './js/auth.js'
      import { Api } from './js/api.js'
      import { Ui } from './js/ui.js'
      import { initNav } from './js/nav.js'
      import { initStatusPolling } from './js/status.js'

      initNav()
      initStatusPolling()

      const summaryEl = document.querySelector('#guild-summary')
      const membersContent = document.querySelector('#members-content')
      const filterInput = document.querySelector('#member-filter')

      let allMembers = []
      let guildData = null

      function renderSummary() {
        if (!guildData) return
        const g = guildData
        const gexpFmt = g.weeklyGexp != null ? Number(g.weeklyGexp).toLocaleString() : '\u2014'
        summaryEl.innerHTML =
          '' +
          '<div class="grid grid-cols-4 mb-md">' +
          '<div class="card stat-card"><div class="stat-value">' +
          Ui.escapeHtml(g.name || '\u2014') +
          '</div><div class="stat-label">Guild Name</div></div>' +
          '<div class="card stat-card"><div class="stat-value">' +
          (g.level || '\u2014') +
          '</div><div class="stat-label">Level</div></div>' +
          '<div class="card stat-card"><div class="stat-value">' +
          (g.memberCount || allMembers.length || '\u2014') +
          '</div><div class="stat-label">Members</div></div>' +
          '<div class="card stat-card"><div class="stat-value">' +
          gexpFmt +
          '</div><div class="stat-label">Weekly GEXP</div></div>' +
          '</div>'
      }

      function renderMembers(filter) {
        const q = (filter || '').trim().toLowerCase()
        const filtered = q
          ? allMembers.filter(function (m) {
              return (m.name || '').toLowerCase().includes(q)
            })
          : allMembers

        if (filtered.length === 0) {
          membersContent.innerHTML =
            '<div class="empty-state"><div class="empty-state-text">' +
            (q ? 'No members match your filter.' : 'No members found.') +
            '</div></div>'
          return
        }

        let html =
          '<div class="table-wrap"><table class="table">' +
          '<thead><tr><th>Rank</th><th>Name</th><th>Status</th><th>Weekly GEXP</th><th>Joined</th></tr></thead>' +
          '<tbody>'
        for (const m of filtered) {
          const onlineBadge = m.online
            ? '<span class="badge badge-success">Online</span>'
            : '<span class="badge badge-muted">Offline</span>'
          const gexp = m.weeklyGexp != null ? Number(m.weeklyGexp).toLocaleString() : '\u2014'
          html +=
            '<tr>' +
            '<td class="text-mono">' +
            Ui.escapeHtml(m.rank || '\u2014') +
            '</td>' +
            '<td><span class="text-mono">' +
            '<img class="avatar" src="https://cravatar.eu/helmavatar/' +
            (m.uuid || m.name || '') +
            '/32.png" alt="" loading="lazy" width="18" height="18" style="border-radius:50%;vertical-align:middle;margin-right:4px">' +
            Ui.escapeHtml(m.name || '\u2014') +
            '</span></td>' +
            '<td>' +
            onlineBadge +
            '</td>' +
            '<td class="text-mono">' +
            gexp +
            '</td>' +
            '<td class="text-xs text-secondary">' +
            (m.joinedAt ? Ui.formatDate(m.joinedAt) : '\u2014') +
            '</td>' +
            '</tr>'
        }
        html += '</tbody></table></div>'
        html +=
          '<div class="text-xs text-muted mt-sm">Showing ' +
          filtered.length +
          ' of ' +
          allMembers.length +
          ' members</div>'
        membersContent.innerHTML = html
      }

      async function loadData() {
        membersContent.innerHTML = '<div class="loading"><div class="loading-spinner"></div></div>'
        try {
          const [overviewRes, membersRes] = await Promise.all([
            Api.apiGet('/api/guild/overview'),
            Api.apiGet('/api/guild/members')
          ])
          guildData = overviewRes && overviewRes.guild ? overviewRes.guild : overviewRes || {}
          allMembers = membersRes && Array.isArray(membersRes.members) ? membersRes.members : []
          renderSummary()
          renderMembers(filterInput.value)
        } catch (error) {
          membersContent.innerHTML =
            '<div class="empty-state"><div class="empty-state-text text-danger">Failed to load guild data: ' +
            Ui.escapeHtml(error.message) +
            '</div></div>'
        }
      }

      function init() {
        filterInput.addEventListener('input', function () {
          renderMembers(this.value)
        })
        loadData()
      }

      const token = Auth.requireAuth()
      if (token) init()
      else globalThis.addEventListener('authsuccess', init, { once: true })
    </script>
  </body>
</html>
