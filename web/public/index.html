<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overview — Rankup</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="app-nav"></div>
    <div class="app-container">
      <div class="page-header">
        <h1 class="page-title">Overview</h1>
        <button class="btn btn-primary" id="run-check-btn">Run Check Now</button>
      </div>
      <div class="card mb-md">
        <div class="card-header"><h2>Check Player</h2></div>
        <div class="card-body">
          <div class="flex gap-sm">
            <input
              type="text"
              class="input"
              id="check-player-input"
              placeholder="Minecraft username..."
              autocomplete="off"
            />
            <button class="btn btn-primary" id="check-player-btn">Check</button>
          </div>
          <div id="check-player-result" class="mt-sm"></div>
        </div>
      </div>
      <div id="bridge-cards"></div>
      <div class="grid grid-cols-2 mt-lg">
        <div class="card">
          <div class="card-header"><h2>Recent Activity</h2></div>
          <div class="card-body" id="recent-activity"></div>
        </div>
        <div class="card">
          <div class="card-header"><h2>System Status</h2></div>
          <div class="card-body" id="system-status"></div>
        </div>
      </div>
    </div>
    <script src="js/common.js"></script>
    <script src="js/overview.js"></script>
  </body>
</html>
