<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overview — Dashboard</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/nav.css" />
    <link rel="stylesheet" href="css/utilities.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <div id="app-nav"></div>
    <div class="app-container">
      <!-- Summary Stats Row -->
      <div class="grid grid-cols-4 mb-md" id="summary-stats">
        <div class="card stat-card">
          <div class="stat-value" id="stat-bridges">—</div>
          <div class="stat-label">Bridges</div>
        </div>
        <div class="card stat-card">
          <div class="stat-value" id="stat-pending">—</div>
          <div class="stat-label">Pending Reviews</div>
        </div>
        <div class="card stat-card">
          <div class="stat-value" id="stat-last-check">—</div>
          <div class="stat-label">Last Check</div>
        </div>
        <div class="card stat-card">
          <div class="stat-value" id="stat-status">—</div>
          <div class="stat-label">System</div>
        </div>
      </div>

      <!-- Actions Bar -->
      <div class="card mb-md">
        <div class="card-body" style="padding: 8px 0">
          <div class="flex gap-sm" style="align-items: center; flex-wrap: wrap">
            <div class="flex gap-sm" style="flex: 1; min-width: 200px">
              <input
                type="text"
                class="input"
                id="check-player-input"
                placeholder="Minecraft username..."
                autocomplete="off"
                style="max-width: 240px"
              />
              <button class="btn btn-primary" id="check-player-btn">Check</button>
            </div>
            <div class="flex gap-sm">
              <button class="btn btn-secondary" id="run-check-btn">Run Check Now</button>
            </div>
          </div>
          <div id="check-player-result" class="mt-sm"></div>
        </div>
      </div>

      <!-- Bridge Cards -->
      <div id="bridge-cards"></div>

      <!-- Activity & Status Grid -->
      <div class="grid grid-cols-2 mt-lg">
        <div class="card">
          <div class="card-header"><h2>Recent Activity</h2></div>
          <div class="card-body" id="recent-activity"></div>
        </div>
        <div class="card">
          <div class="card-header"><h2>System Status</h2></div>
          <div class="card-body" id="system-status"></div>
        </div>
      </div>
    </div>
    <script type="module" src="js/overview.js"></script>
  </body>
</html>
