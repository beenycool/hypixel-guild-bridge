<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tournaments — Hypixel Bridge</title>
    <link rel="stylesheet" href="css/app.css" />
    <style>
      .tournament-card {
        background: #1a1a2e;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .tournament-card h3 {
        margin: 0 0 8px;
        color: #e0e0e0;
      }
      .status-badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
      }
      .match-row {
        display: flex;
        align-items: center;
        padding: 8px;
        border-bottom: 1px solid #333;
      }
      .match-row:last-child {
        border-bottom: none;
      }
      .player-name {
        flex: 1;
      }
      .score {
        margin: 0 16px;
        font-weight: bold;
      }
      .completed {
        color: #2ecc71;
      }
      .pending {
        color: #888;
      }
      .disputed {
        color: #e74c3c;
      }
      .bracket-view {
        overflow-x: auto;
        white-space: nowrap;
        padding: 8px 0;
      }
      .round-column {
        display: inline-block;
        vertical-align: top;
        margin-right: 24px;
        min-width: 200px;
      }
      .round-column h4 {
        margin: 0 0 8px;
        color: #aaa;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .empty-state {
        text-align: center;
        padding: 40px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div id="app-nav"></div>
    <div class="app-container">
      <div class="page-header">
        <h1 class="page-title">Tournaments</h1>
        <button class="btn btn-secondary btn-sm" id="refresh-btn">Refresh</button>
      </div>
      <div id="loading" class="loading"><div class="loading-spinner"></div></div>
      <div id="error" class="empty-state" style="display: none"></div>
      <div id="tournament-list"></div>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ws.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/common.js"></script>
    <script>
      'use strict'
      ;(function () {
        const listEl = document.querySelector('#tournament-list')
        const loadingEl = document.querySelector('#loading')
        const errorEl = document.querySelector('#error')
        const refreshBtn = document.querySelector('#refresh-btn')

        function showLoading(msg) {
          loadingEl.style.display = 'block'
          loadingEl.textContent = msg || 'Loading...'
          errorEl.style.display = 'none'
        }

        function hideLoading() {
          loadingEl.style.display = 'none'
        }

        function showError(msg) {
          hideLoading()
          errorEl.style.display = 'block'
          errorEl.textContent = msg || 'An error occurred.'
        }

        function statusClass(status) {
          const map = {
            SIGNUP: 'badge badge-success',
            ACTIVE: 'badge badge-warning',
            COMPLETED: 'badge badge-info',
            CANCELLED: 'badge badge-danger'
          }
          return map[status] || 'badge badge-muted'
        }

        async function loadTournaments() {
          showLoading('Loading tournaments...')
          try {
            const data = await AppApi.apiGet('/api/tournament/list')
            hideLoading()

            if (!Array.isArray(data) || data.length === 0) {
              listEl.innerHTML = '<div class="empty-state">No tournaments found.</div>'
              return
            }

            let html = ''
            for (const t of data) {
              html += '<div class="tournament-card">'
              html += '<h3>' + AppUi.escapeHtml(t.name || 'Unnamed') + '</h3>'
              html += '<div style="margin-bottom:8px">'
              html += '  <span class="' + statusClass(t.status) + '">' + AppUi.escapeHtml(t.status) + '</span>'
              html += '  <span style="margin-left:12px">Game: ' + AppUi.escapeHtml(t.gameType || '?') + '</span>'
              html += '  <span style="margin-left:12px">Bo' + AppUi.escapeHtml(String(t.bestOf ?? 3)) + '</span>'
              html += '</div>'
              html += '<div style="margin-top:8px">'
              html += '  <a href="#" class="view-bracket" data-id="' + t.id + '">View Bracket</a>'
              html += '</div>'
              html += '</div>'
            }
            listEl.innerHTML = html

            for (const link of listEl.querySelectorAll('.view-bracket')) {
              link.addEventListener('click', function (e) {
                e.preventDefault()
                showTournament(Number(this.dataset.id))
              })
            }
          } catch (err) {
            showError('Error: ' + AppUi.escapeHtml(err.message))
          }
        }

        async function showTournament(id) {
          showLoading('Loading bracket...')
          try {
            const data = await AppApi.apiGet('/api/tournament/' + id)
            hideLoading()

            const tournament = data.tournament
            const matches = Array.isArray(data.matches) ? data.matches : []
            const players = Array.isArray(data.players) ? data.players : []

            const playerMap = {}
            for (const p of players) {
              playerMap[p.id] = p.playerUuid
            }

            const rounds = {}
            for (const m of matches) {
              if (!rounds[m.round]) rounds[m.round] = []
              rounds[m.round].push(m)
            }

            let html = '<div class="tournament-card">'
            html += '<h3>' + AppUi.escapeHtml(tournament.name || 'Tournament') + ' — Bracket</h3>'
            html += '  <div style="margin-bottom:8px">'
            html +=
              '    <span class="' +
              statusClass(tournament.status) +
              '">' +
              AppUi.escapeHtml(tournament.status) +
              '</span>'
            html += '  </div>'
            html += '  <a href="#" id="back-to-list">&larr; Back to list</a>'
            html += '</div>'

            html += '<div class="bracket-view">'
            const roundKeys = Object.keys(rounds).sort(function (a, b) {
              return Number(a) - Number(b)
            })
            for (const round of roundKeys) {
              html += '<div class="round-column">'
              html += '  <h4>Round ' + AppUi.escapeHtml(round) + '</h4>'
              for (const m of rounds[round]) {
                const p1 = playerMap[m.player1Id] || 'TBD'
                const p2 = playerMap[m.player2Id] || 'TBD'
                let cls = 'pending'
                if (m.status === 'COMPLETED' || m.status === 'BYE') cls = 'completed'
                else if (m.status === 'DISPUTED') cls = 'disputed'

                html += '<div class="match-row ' + cls + '">'
                html += '  <span class="player-name">' + AppUi.escapeHtml(p1) + '</span>'
                html += '  <span class="score">' + (m.player1Wins ?? '-') + ' : ' + (m.player2Wins ?? '-') + '</span>'
                html += '  <span class="player-name">' + AppUi.escapeHtml(p2) + '</span>'
                html += '  <span style="margin-left:8px;font-size:11px">' + AppUi.escapeHtml(m.status) + '</span>'
                html += '</div>'
              }
              html += '</div>'
            }
            html += '</div>'

            listEl.innerHTML = html

            const backBtn = document.querySelector('#back-to-list')
            if (backBtn) {
              backBtn.addEventListener('click', function (e) {
                e.preventDefault()
                loadTournaments()
              })
            }
          } catch (err) {
            showError('Error: ' + AppUi.escapeHtml(err.message))
          }
        }

        function init() {
          AppUi.injectNav('overview')
          refreshBtn.addEventListener('click', loadTournaments)
          loadTournaments()
        }

        const token = App.requireAuth()
        if (token) init()
        else globalThis.addEventListener('authsuccess', init, { once: true })
      })()
    </script>
  </body>
</html>
