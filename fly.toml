app = 'hypixel-guild-discord-bridge'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  # Point directly to the root of /data
  CONFIG_DIR = '/data'
  CONFIG_PATH = '/data/config.yaml'

[mounts]
  source = 'bridge_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1